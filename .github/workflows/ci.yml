name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Nothing here needs secrets, so the job gets read-only repo access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Fails if package.json and package-lock.json disagree, so builds stay
      # reproducible and no dependency drifts in silently.
      - name: Install from lockfile
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Rate limit and origin regression checks
        run: |
          npm run start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 2
          done
          node scripts/verify-rate-limit.mjs http://127.0.0.1:3000
