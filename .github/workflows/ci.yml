name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Nothing here needs secrets, so the job gets read-only repo access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and security checks
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs rather than the moving v7 tags, so a retagged
      # upstream release cannot silently change what runs with our repo token.
      # Dependabot still updates SHA-pinned actions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Fails if package.json and package-lock.json disagree, so builds stay
      # reproducible and no dependency drifts in silently.
      - name: Install from lockfile
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Needs no server and no browser: it drives the validator and lifts the email
      # template straight out of route.js, so the escaping invariant is checked
      # before anything is built or booted.
      - name: XSS and input-validation checks
        run: node scripts/verify-xss.mjs

      # Stubbed siteverify, so every fail-closed branch of the CAPTCHA check runs
      # without a network call.
      - name: Turnstile contract checks
        run: node scripts/verify-captcha.mjs

      - name: Production build
        run: npm run build

      - name: Rate limit, origin and CSP regression checks
        run: |
          npm run start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 2
          done
          node scripts/verify-rate-limit.mjs http://127.0.0.1:3000
          node scripts/verify-csp.mjs http://127.0.0.1:3000
