name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Nothing here needs secrets, so the job gets read-only repo access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and security checks
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs rather than the moving v7 tags, so a retagged
      # upstream release cannot silently change what runs with our repo token.
      # Dependabot still updates SHA-pinned actions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from the same file a local version manager would use, so CI and a
          # developer machine cannot drift to different majors without noticing.
          node-version-file: .node-version
          cache: npm

      # Fails if package.json and package-lock.json disagree, so builds stay
      # reproducible and no dependency drifts in silently.
      - name: Install from lockfile
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Next 16 no longer lints during `next build`, so it needs its own step or it
      # simply never runs. Warnings are allowed; errors are not.
      - name: Lint
        run: npm run lint

      # Needs no server and no browser: it drives the validator and lifts the email
      # template straight out of route.js, so the escaping invariant is checked
      # before anything is built or booted.
      - name: XSS and input-validation checks
        run: node scripts/verify-xss.mjs

      # Stubbed siteverify, so every fail-closed branch of the CAPTCHA check runs
      # without a network call.
      - name: Turnstile contract checks
        run: node scripts/verify-captcha.mjs

      # The contact form's response handling lives in a pure function precisely so
      # this can run without a browser: nothing else here covers what the visitor
      # is shown when the firewall answers with HTML instead of JSON.
      - name: Contact response contract checks
        run: node scripts/verify-contact-response.mjs

      # Keeps the failure path from writing visitor content into retained function
      # logs. Needs no server: it drives the summariser with fabricated SMTP errors
      # carrying canaries, and asserts the old raw-object log would have leaked them.
      - name: Error-logging safety checks
        run: node scripts/verify-error-logging.mjs

      # Reads the notice and the code it describes in one run. Nothing else here can
      # see this class of defect: a wrong sentence in a published privacy notice
      # leaves every other step green.
      - name: Privacy notice claim checks
        run: node scripts/verify-privacy-claims.mjs

      - name: Production build
        run: npm run build

      - name: Rate limit, origin and CSP regression checks
        run: |
          npm run start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 2
          done
          node scripts/verify-rate-limit.mjs http://127.0.0.1:3000
          node scripts/verify-csp.mjs http://127.0.0.1:3000
