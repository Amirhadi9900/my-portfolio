version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Major bumps change behaviour; leave them as separate, reviewable PRs.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Actions are supply-chain surface: pin review is worth a weekly look.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
